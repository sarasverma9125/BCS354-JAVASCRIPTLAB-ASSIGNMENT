<!DOCTYPE html>
<html>
<body>

<input type="text" id="note">
<button onclick="saveNote()">Save</button>

<script>
window.onload = function () {
    document.getElementById("note").value =
        localStorage.getItem("note") || "";
};

function saveNote() {
    localStorage.setItem(
        "note",
        document.getElementById("note").value
    );
}
</script>

</body>
</html>
